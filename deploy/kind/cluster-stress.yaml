    extraPortMappings:
      - containerPort: 30090
        hostPort: 18090
        protocol: TCP
      - containerPort: 30100
        hostPort: 18100
        protocol: TCP
      - containerPort: 30566
        hostPort: 18566
        protocol: TCP
      - containerPort: 30300
        hostPort: 13000
        protocol: TCP
      - containerPort: 30317
        hostPort: 14317
        protocol: TCP
  - role: worker
  - role: worker
  - role: worker
