apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: scrapd
  namespace: scrap
spec:
  serviceName: scrap-headless
  replicas: 3
  selector:
    matchLabels:
      app: scrap
  template:
    metadata:
      labels:
        app: scrap
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: scrapd
          image: ghcr.io/petabytecl/scrap/scrapd:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9090
              name: client
            - containerPort: 9091
              name: peer
            - containerPort: 9100
              name: metrics
          env:
            - name: SCRAP_REPLICAS
              value: "3"
            - name: SCRAP_HEADLESS_SERVICE
              value: "scrap-headless"
            - name: SCRAP_CELL_ID
              value: "kind-dev"
            - name: SCRAP_PEER_PORT
              value: "9091"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          args:
            - "--data-dir=/data"
            - "--listen-addr=:9090"
            - "--admin-addr=:9100"
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
          readinessProbe:
            exec:
              command:
                - /scrapd
                - healthcheck
                - --address=127.0.0.1:9090
                - --service=scrap.v1-readiness
                - --timeout=1s
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            exec:
              command:
                - /scrapd
                - healthcheck
                - --address=127.0.0.1:9090
                - --timeout=1s
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: scrap
                topologyKey: kubernetes.io/hostname
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
