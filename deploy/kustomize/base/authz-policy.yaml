apiVersion: v1
kind: ConfigMap
metadata:
  name: scrapd-authz-policy
data:
  authz-policy.json: |
    {
      "version": "local-kind-v1",
      "workloads": {
        "local-operator": {
          "capabilities": [
            "admin.inspect.cluster_summary",
            "admin.inspect.shard",
            "admin.inspect.document",
            "admin.inspect.block",
            "admin.inspect.member",
            "admin.inspect.capacity_runway",
            "admin.operation.get",
            "admin.operation.watch",
            "admin.operation.list",
            "admin.operation.cancel",
            "admin.restore.plan",
            "admin.restore.start",
            "admin.prewarm.plan",
            "admin.prewarm.start",
            "admin.repair.queue",
            "admin.repair.plan",
            "admin.repair.start",
            "admin.scrub.plan",
            "admin.scrub.start",
            "admin.member.cordon",
            "admin.member.uncordon",
            "admin.member.eviction_safety",
            "admin.member.drain.plan",
            "admin.member.drain.start",
            "admin.lifecycle.tombstone.plan",
            "admin.lifecycle.tombstone.start",
            "admin.key_rotation.plan",
            "admin.key_rotation.start",
            "admin.capacity_override.plan",
            "admin.capacity_override.start",
            "admin.dr.readiness",
            "admin.dr.recovery.plan",
            "admin.dr.metadata_restore.start",
            "admin.dr.copy_verify.start",
            "admin.dr.drill.start"
          ]
        },
        "local-public-client": {
          "capabilities": [
            "public.document.write",
            "public.document.head",
            "public.document.read",
            "public.document.find",
            "public.transaction.complete",
            "public.transaction.get"
          ]
        }
      }
    }
