apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - serviceaccount.yaml
  - service.yaml
  - networkpolicy.yaml
  - statefulset.yaml
configMapGenerator:
  - name: scrapd-authz-policy
    files:
      - authz-policy.json
generatorOptions:
  disableNameSuffixHash: true
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: scrap
      app.kubernetes.io/part-of: scrap-storage-gateway
