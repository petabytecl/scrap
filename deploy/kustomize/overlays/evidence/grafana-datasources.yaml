apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-evidence-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Mimir
        type: prometheus
        access: proxy
        url: http://mimir.monitoring.svc:9009/prometheus
        isDefault: true
        editable: false
        jsonData:
          httpMethod: POST

      - name: Loki
        type: loki
        access: proxy
        url: http://loki.monitoring.svc:3100
        editable: false
        jsonData:
          derivedFields:
            - name: TraceID
              datasourceUid: tempo
              matcherRegex: '"trace_id":"([a-f0-9]+)"'
              url: "$${__value.raw}"

      - name: Tempo
        type: tempo
        access: proxy
        uid: tempo
        url: http://tempo.monitoring.svc:3200
        editable: false
        jsonData:
          tracesToMetrics:
            datasourceUid: mimir
          tracesToLogs:
            datasourceUid: loki

      - name: Pyroscope
        type: grafana-pyroscope-datasource
        access: proxy
        url: http://pyroscope.monitoring.svc:4040
        editable: false
