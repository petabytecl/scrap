apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: scrap-local
resources:
  - ../local-dev
patches:
  - path: statefulset-prod-like-patch.yaml
    target:
      kind: StatefulSet
      name: scrapd
  - path: statefulset-runtime-identity-patch.yaml
    target:
      kind: StatefulSet
      name: scrapd
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      cl.petabyte.scrap/environment: local-prod-like
