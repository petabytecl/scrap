apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-transit-smoke
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: scrap-local-openbao-auth-delegator
subjects:
  - kind: ServiceAccount
    name: openbao
    namespace: scrap-local
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbao
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: openbao
  template:
    metadata:
      labels:
        app.kubernetes.io/component: openbao
    spec:
      serviceAccountName: openbao
      containers:
        - name: openbao
          image: openbao/openbao:2.3.2
          imagePullPolicy: IfNotPresent
          args:
            - server
            - -dev
            - -dev-listen-address=0.0.0.0:8200
            - -dev-root-token-id=local-root
          env:
            - name: BAO_ADDR
              value: http://127.0.0.1:8200
            - name: BAO_TOKEN
              value: local-root
          ports:
            - name: http
              containerPort: 8200
          readinessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: openbao
spec:
  selector:
    app.kubernetes.io/component: openbao
  ports:
    - name: http
      port: 8200
      targetPort: http
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-transit-bootstrap
spec:
  template:
    spec:
      serviceAccountName: openbao
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: openbao/openbao:2.3.2
          imagePullPolicy: IfNotPresent
          env:
            - name: BAO_ADDR
              value: http://openbao:8200
            - name: BAO_TOKEN
              value: local-root
          command:
            - /bin/sh
            - -ec
            - |
              until bao status >/dev/null 2>&1; do
                sleep 1
              done
              bao audit enable file file_path=/tmp/openbao-audit.log || true
              bao secrets enable -path=transit transit || true
              bao write -f transit/keys/scrap-backend || true
              bao auth enable kubernetes || true
              bao write auth/kubernetes/config \
                token_reviewer_jwt="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
                kubernetes_host="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}" \
                kubernetes_ca_cert=@/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              bao policy write scrap-transit-client - <<'POLICY'
              path "transit/datakey/plaintext/scrap-backend" {
                capabilities = ["update"]
              }
              path "transit/decrypt/scrap-backend" {
                capabilities = ["update"]
              }
              path "transit/rewrap/scrap-backend" {
                capabilities = ["update"]
              }
              path "sys/capabilities-self" {
                capabilities = ["update"]
              }
              POLICY
              bao write auth/kubernetes/role/scrap-transit-smoke \
                bound_service_account_names=openbao-transit-smoke \
                bound_service_account_namespaces=scrap-local \
                policies=scrap-transit-client \
                ttl=10m
