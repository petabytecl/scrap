apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy
rules:
  - apiGroups: [""]
    resources: [pods, nodes, services, endpoints]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: monitoring
data:
  config.alloy: |
    // Discover scrapd pods and keep only their admin (pprof) port 9100.
    discovery.kubernetes "scrapd" {
      role = "pod"
      namespaces {
        names = ["scrap"]
      }
    }

    discovery.relabel "scrapd" {
      targets = discovery.kubernetes.scrapd.targets

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        regex         = "scrap"
        action        = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_port_number"]
        regex         = "9100"
        action        = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        target_label = "service_name"
        replacement  = "scrapd"
      }
    }

    // Pull pprof profiles from scrapd's admin endpoint (gated by SCRAP_PPROF_ENABLED).
    pyroscope.scrape "scrapd" {
      targets         = discovery.relabel.scrapd.output
      forward_to      = [pyroscope.write.default.receiver]
      scrape_interval = "15s"

      profiling_config {
        profile.process_cpu { enabled = true }
        profile.memory      { enabled = true }
        profile.goroutine   { enabled = true }
        profile.block       { enabled = false }
        profile.mutex       { enabled = false }
      }
    }

    pyroscope.write "default" {
      endpoint {
        url = "http://pyroscope.monitoring.svc:4040"
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
    spec:
      serviceAccountName: alloy
      containers:
        - name: alloy
          image: grafana/alloy:v1.7.5@sha256:b92703c13c32c20d629ffd89f40287ed385c12a335a7c9f31c720a5f912f9d6f
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/tmp/alloy
            - --server.http.listen-addr=0.0.0.0:12345
          ports:
            - containerPort: 12345
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: alloy-tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: alloy-tmp
          emptyDir: {}
