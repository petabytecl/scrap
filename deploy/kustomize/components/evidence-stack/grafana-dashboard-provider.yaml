apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-evidence-dashboard-providers
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: evidence
        orgId: 1
        folder: Evidence
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
