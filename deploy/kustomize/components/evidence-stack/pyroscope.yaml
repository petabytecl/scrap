apiVersion: apps/v1
kind: Deployment
metadata:
  name: pyroscope
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pyroscope
  template:
    metadata:
      labels:
        app: pyroscope
    spec:
      # grafana/pyroscope's image declares a non-numeric user ("pyroscope"),
      # which runAsNonRoot cannot verify; pin a numeric non-root UID and
      # fsGroup so the /data PVC is writable.
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: pyroscope
          image: grafana/pyroscope:1.13.3@sha256:545ef78ff6ad3217b9c81e76bad2bcec947a6ac134c2ed3e6019b3165142292f
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          args:
            # Default data path is ./data in the read-only root filesystem;
            # use the writable /data PVC instead.
            - -pyroscopedb.data-path=/data
          ports:
            - containerPort: 4040
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pyroscope-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pyroscope-data
  namespace: monitoring
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: pyroscope
  namespace: monitoring
spec:
  type: ClusterIP
  selector:
    app: pyroscope
  ports:
    - port: 4040
      targetPort: 4040
