apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - prometheus-config.yaml
  - prometheus.yaml
  - grafana-datasource.yaml
  - grafana-dashboard-provider.yaml
  - grafana.yaml

configMapGenerator:
  - name: grafana-dashboard-scrapd
    namespace: monitoring
    files:
      - scrapd.json
    options:
      disableNameSuffixHash: true
