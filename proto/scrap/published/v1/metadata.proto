syntax = "proto3";

package scrap.published.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/petabytecl/scrap/internal/gen/scrap/published/v1;publishedv1";

message CurrentPointer {
  uint32 schema_version = 1;
  string cell_id = 2;
  string source_namespace = 3;
  uint64 generation = 4;
  string manifest_id = 5;
  bytes manifest_sha256 = 6;
  google.protobuf.Timestamp published_at = 7;
}

message Manifest {
  uint32 schema_version = 1;
  string cell_id = 2;
  string source_namespace = 3;
  string manifest_id = 4;
  uint64 generation = 5;
  google.protobuf.Timestamp published_at = 6;
  repeated ShardWatermark shard_watermarks = 7;
  repeated ArtifactRef snapshots = 8;
  repeated ArtifactRef tails = 9;
  repeated ObjectRef required_objects = 10;
  string producer_build = 11;
  string producer_schema = 12;
}

message ShardWatermark {
  string shard_id = 1;
  uint64 high_watermark = 2;
}

message ArtifactRef {
  ArtifactKind kind = 1;
  string shard_id = 2;
  string object_key = 3;
  uint64 length = 4;
  bytes sha256 = 5;
  uint64 first_index = 6;
  uint64 last_index = 7;
}

enum ArtifactKind {
  ARTIFACT_KIND_UNSPECIFIED = 0;
  ARTIFACT_KIND_SNAPSHOT = 1;
  ARTIFACT_KIND_TAIL = 2;
}

message ObjectRef {
  ObjectKind kind = 1;
  string object_key = 2;
  uint64 length = 3;
  bytes sha256 = 4;
  string envelope_id = 5;
}

enum ObjectKind {
  OBJECT_KIND_UNSPECIFIED = 0;
  OBJECT_KIND_BLOCK = 1;
  OBJECT_KIND_INDEX = 2;
  OBJECT_KIND_ENVELOPE = 3;
}

message SnapshotRecord {
  uint32 schema_version = 1;
  string source_namespace = 2;
  string shard_id = 3;
  uint64 high_watermark = 4;
  oneof record {
    PublishedDocument document = 5;
    PublishedTransaction transaction = 6;
    PublishedTombstone tombstone = 7;
  }
}

message TailRecord {
  uint32 schema_version = 1;
  string source_namespace = 2;
  string shard_id = 3;
  uint64 log_index = 4;
  oneof mutation {
    PublishedDocument finalized_document = 5;
    PublishedTransaction transaction_state = 6;
    PublishedObjectState object_state = 7;
    PublishedTombstone tombstone = 8;
  }
}

message PublishedDocument {
  string tenant_id = 1;
  string transaction_id = 2;
  string document_name = 3;
  uint32 document_class = 4;
  uint32 priority_class = 5;
  optional string content_type = 6;
  uint64 length = 7;
  bytes logical_sha256 = 8;
  bytes document_identity_fingerprint = 9;
  string created_by_service = 10;
  optional string workflow_stage = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp finalized_at = 13;
  uint32 availability = 14;
  uint32 lifecycle_state = 15;
  map<string, string> tags = 16;
  repeated PublishedLocation locations = 17;
}

message PublishedLocation {
  string block_id = 1;
  uint64 stored_offset = 2;
  uint64 stored_length = 3;
  repeated PublishedFrame frames = 4;
  string backend_object_key = 5;
  string index_object_key = 6;
  string envelope_object_key = 7;
  uint32 format_version = 8;
}

message PublishedFrame {
  uint64 frame_offset = 1;
  uint64 segment_offset = 2;
  uint64 segment_length = 3;
  bytes sha256 = 4;
}

message PublishedTransaction {
  string tenant_id = 1;
  string transaction_id = 2;
  uint32 state = 3;
  uint32 document_count = 4;
  uint32 permanent_document_count = 5;
  uint32 ephemeral_document_count = 6;
  google.protobuf.Timestamp created_at = 7;
  optional google.protobuf.Timestamp completed_at = 8;
  optional google.protobuf.Timestamp timeout_at = 9;
  map<string, string> tags = 10;
}

message PublishedObjectState {
  ObjectRef object = 1;
  uint64 available_at_index = 2;
}

message PublishedTombstone {
  string tenant_id = 1;
  string transaction_id = 2;
  optional string document_name = 3;
  uint64 tombstoned_at_index = 4;
  google.protobuf.Timestamp tombstoned_at = 5;
}
