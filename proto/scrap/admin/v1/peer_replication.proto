syntax = "proto3";

package scrap.admin.v1;

import "scrap/v1/document.proto";
import "scrap/v1/identity.proto";

option go_package = "github.com/petabytecl/scrap/internal/gen/scrap/admin/v1;adminv1";

service PeerReplicationService {
  rpc PrepareDocument(PrepareDocumentRequest) returns (PrepareDocumentResponse);
}

message PrepareDocumentRequest {
  scrap.v1.DocumentIdentity identity = 1;
  scrap.v1.PriorityClass priority_class = 2;
  string block_id = 3;
  uint64 stored_offset = 4;
  uint64 stored_length = 5;
  bytes logical_sha256 = 6;
  bytes stored_sha256 = 7;
  repeated PreparedFrame frames = 8;
  bytes data = 9;
}

message PreparedFrame {
  uint64 frame_offset = 1;
  uint64 segment_offset = 2;
  uint64 segment_length = 3;
  bytes sha256 = 4;
}

message PrepareDocumentResponse {
  PeerReplicaReceipt receipt = 1;
}

message PeerReplicaReceipt {
  string member_id = 1;
  string block_id = 2;
  uint64 stored_offset = 3;
  uint64 stored_length = 4;
  bytes logical_sha256 = 5;
  bytes stored_sha256 = 6;
}
