syntax = "proto3";

package scrap.admin.v1;

import "google/protobuf/timestamp.proto";
import "scrap/admin/v1/operations.proto";

option go_package = "github.com/petabytecl/scrap/internal/gen/scrap/admin/v1;adminv1";

service InspectService {
  rpc GetClusterSummary(GetClusterSummaryRequest) returns (GetClusterSummaryResponse);
  rpc GetShard(GetShardRequest) returns (GetShardResponse);
  rpc GetDocument(GetDocumentRequest) returns (GetDocumentResponse);
  rpc GetBlock(GetBlockRequest) returns (GetBlockResponse);
  rpc GetMember(GetMemberRequest) returns (GetMemberResponse);
  rpc GetCapacityRunway(GetCapacityRunwayRequest) returns (GetCapacityRunwayResponse);
}

service OperationService {
  rpc GetOperation(GetOperationRequest) returns (GetOperationResponse);
  rpc WatchOperation(WatchOperationRequest) returns (stream WatchOperationResponse);
  rpc ListOperations(ListOperationsRequest) returns (ListOperationsResponse);
  rpc CancelOperation(CancelOperationRequest) returns (CancelOperationResponse);
}

service RestoreService {
  rpc PlanRestore(PlanRestoreRequest) returns (PlanRestoreResponse);
  rpc StartRestore(StartRestoreRequest) returns (StartRestoreResponse);
  rpc PlanPrewarm(PlanPrewarmRequest) returns (PlanPrewarmResponse);
  rpc StartPrewarm(StartPrewarmRequest) returns (StartPrewarmResponse);
}

service RepairService {
  rpc GetRepairQueue(GetRepairQueueRequest) returns (GetRepairQueueResponse);
  rpc PlanRepair(PlanRepairRequest) returns (PlanRepairResponse);
  rpc StartRepair(StartRepairRequest) returns (StartRepairResponse);
  rpc PlanScrub(PlanScrubRequest) returns (PlanScrubResponse);
  rpc StartScrub(StartScrubRequest) returns (StartScrubResponse);
}

service MemberService {
  rpc CordonMember(CordonMemberRequest) returns (CordonMemberResponse);
  rpc UncordonMember(UncordonMemberRequest) returns (UncordonMemberResponse);
  rpc GetEvictionSafety(GetEvictionSafetyRequest) returns (GetEvictionSafetyResponse);
  rpc PlanDrain(PlanDrainRequest) returns (PlanDrainResponse);
  rpc StartDrain(StartDrainRequest) returns (StartDrainResponse);
}

service LifecycleService {
  rpc PlanTombstone(PlanTombstoneRequest) returns (PlanTombstoneResponse);
  rpc StartTombstone(StartTombstoneRequest) returns (StartTombstoneResponse);
}

service DisasterRecoveryService {
  rpc GetRecoveryReadiness(GetRecoveryReadinessRequest) returns (GetRecoveryReadinessResponse);
  rpc PlanRecovery(PlanRecoveryRequest) returns (PlanRecoveryResponse);
  rpc StartMetadataRestore(StartMetadataRestoreRequest) returns (StartMetadataRestoreResponse);
  rpc StartCopyVerify(StartCopyVerifyRequest) returns (StartCopyVerifyResponse);
  rpc StartDRDrill(StartDRDrillRequest) returns (StartDRDrillResponse);
}

message GetClusterSummaryRequest {}

message GetClusterSummaryResponse {
  ClusterSummary summary = 1;
}

message ClusterSummary {
  uint32 shard_count = 1;
  uint32 storage_member_count = 2;
  uint64 local_bytes_used = 3;
  uint64 local_bytes_capacity = 4;
  uint32 degraded_document_count = 5;
  uint32 pending_operation_count = 6;
}

message GetShardRequest {
  string shard_id = 1;
}

message GetShardResponse {
  Shard shard = 1;
}

message Shard {
  string shard_id = 1;
  string leader_member_id = 2;
  repeated string voter_member_ids = 3;
  uint64 committed_index = 4;
  uint64 applied_index = 5;
  uint32 open_transaction_count = 6;
}

message GetDocumentRequest {
  DocumentTarget document = 1;
}

message GetDocumentResponse {
  AdminDocument document = 1;
}

message AdminDocument {
  DocumentTarget document = 1;
  string shard_id = 2;
  repeated string block_ids = 3;
  uint64 length = 4;
  bytes logical_sha256 = 5;
  bool repair_required = 6;
}

message GetBlockRequest {
  BlockTarget block = 1;
}

message GetBlockResponse {
  Block block = 1;
}

message Block {
  string shard_id = 1;
  string block_id = 2;
  uint64 length = 3;
  bytes checksum = 4;
  repeated string replica_member_ids = 5;
  string backend_object_key = 6;
}

message GetMemberRequest {
  StorageMemberTarget storage_member = 1;
}

message GetMemberResponse {
  StorageMember storage_member = 1;
}

message StorageMember {
  string storage_member_id = 1;
  string cell_id = 2;
  MemberState state = 3;
  bool cordoned = 4;
  uint64 bytes_used = 5;
  uint64 bytes_capacity = 6;
  google.protobuf.Timestamp last_seen_at = 7;
}

enum MemberState {
  MEMBER_STATE_UNSPECIFIED = 0;
  MEMBER_STATE_ONLINE = 1;
  MEMBER_STATE_DRAINING = 2;
  MEMBER_STATE_OFFLINE = 3;
}

message GetCapacityRunwayRequest {
  optional string capacity_profile_id = 1;
}

message GetCapacityRunwayResponse {
  CapacityRunway runway = 1;
}

message CapacityRunway {
  string capacity_profile_id = 1;
  uint64 usable_bytes_remaining = 2;
  uint64 estimated_bytes_per_day = 3;
  uint32 runway_days = 4;
  repeated OperationWarning warnings = 5;
}

message GetOperationRequest {
  string operation_id = 1;
}

message GetOperationResponse {
  Operation operation = 1;
}

message WatchOperationRequest {
  string operation_id = 1;
  optional uint64 after_sequence = 2;
}

message WatchOperationResponse {
  uint64 sequence = 1;
  Operation operation = 2;
  OperationDelta delta = 3;
}

message OperationDelta {
  OperationState state = 1;
  OperationProgress progress = 2;
  repeated OperationWarning warnings = 3;
  optional OperationError last_error = 4;
}

message ListOperationsRequest {
  repeated OperationState states = 1;
  optional string operation_type = 2;
  optional uint32 page_size = 3;
  string page_token = 4;
}

message ListOperationsResponse {
  repeated Operation operations = 1;
  string next_page_token = 2;
}

message CancelOperationRequest {
  string operation_id = 1;
}

message CancelOperationResponse {
  Operation operation = 1;
}

message PlanRestoreRequest {
  repeated Target targets = 1;
  bool dry_run = 2;
  map<string, string> metadata = 3;
}

message PlanRestoreResponse {
  OperationPlan plan = 1;
}

message StartRestoreRequest {
  string operation_plan_id = 1;
  string plan_hash = 2;
  map<string, string> metadata = 3;
  string operation_id = 4;
}

message StartRestoreResponse {
  Operation operation = 1;
}

message PlanPrewarmRequest {
  repeated Target targets = 1;
  optional google.protobuf.Timestamp pin_until = 2;
  bool dry_run = 3;
  map<string, string> metadata = 4;
}

message PlanPrewarmResponse {
  OperationPlan plan = 1;
}

message StartPrewarmRequest {
  string operation_plan_id = 1;
  string plan_hash = 2;
  map<string, string> metadata = 3;
  string operation_id = 4;
}

message StartPrewarmResponse {
  Operation operation = 1;
}

message GetRepairQueueRequest {
  optional string shard_id = 1;
  optional uint32 page_size = 2;
  string page_token = 3;
}

message GetRepairQueueResponse {
  repeated RepairQueueItem items = 1;
  string next_page_token = 2;
}

message RepairQueueItem {
  Target target = 1;
  string reason = 2;
  google.protobuf.Timestamp detected_at = 3;
}

message PlanRepairRequest {
  repeated Target targets = 1;
  bool dry_run = 2;
  map<string, string> metadata = 3;
}

message PlanRepairResponse {
  OperationPlan plan = 1;
}

message StartRepairRequest {
  string operation_plan_id = 1;
  string plan_hash = 2;
  map<string, string> metadata = 3;
  string operation_id = 4;
}

message StartRepairResponse {
  Operation operation = 1;
}

message PlanScrubRequest {
  repeated Target targets = 1;
  bool dry_run = 2;
  map<string, string> metadata = 3;
}

message PlanScrubResponse {
  OperationPlan plan = 1;
}

message StartScrubRequest {
  string operation_plan_id = 1;
  string plan_hash = 2;
  map<string, string> metadata = 3;
  string operation_id = 4;
}

message StartScrubResponse {
  Operation operation = 1;
}

message CordonMemberRequest {
  StorageMemberTarget storage_member = 1;
  string reason = 2;
  string operation_id = 3;
}

message CordonMemberResponse {
  StorageMember storage_member = 1;
}

message UncordonMemberRequest {
  StorageMemberTarget storage_member = 1;
  string operation_id = 2;
}

message UncordonMemberResponse {
  StorageMember storage_member = 1;
}

message GetEvictionSafetyRequest {
  StorageMemberTarget storage_member = 1;
}

message GetEvictionSafetyResponse {
  EvictionSafety safety = 1;
}

message EvictionSafety {
  StorageMemberTarget storage_member = 1;
  bool safe_to_evict = 2;
  repeated OperationWarning warnings = 3;
}

message PlanDrainRequest {
  StorageMemberTarget storage_member = 1;
  bool dry_run = 2;
  map<string, string> metadata = 3;
}

message PlanDrainResponse {
  OperationPlan plan = 1;
}

message StartDrainRequest {
  string operation_plan_id = 1;
  string plan_hash = 2;
  map<string, string> metadata = 3;
  string operation_id = 4;
}

message StartDrainResponse {
  Operation operation = 1;
}

message PlanTombstoneRequest {
  repeated Target targets = 1;
  bool dry_run = 2;
  map<string, string> metadata = 3;
}

message PlanTombstoneResponse {
  OperationPlan plan = 1;
}

message StartTombstoneRequest {
  string operation_plan_id = 1;
  string plan_hash = 2;
  map<string, string> metadata = 3;
  string operation_id = 4;
}

message StartTombstoneResponse {
  Operation operation = 1;
}

message GetRecoveryReadinessRequest {}

message GetRecoveryReadinessResponse {
  RecoveryReadiness readiness = 1;
}

message RecoveryReadiness {
  bool ready = 1;
  repeated OperationWarning warnings = 2;
  google.protobuf.Timestamp latest_restorable_checkpoint_at = 3;
}

message PlanRecoveryRequest {
  repeated Target targets = 1;
  bool dry_run = 2;
  map<string, string> metadata = 3;
}

message PlanRecoveryResponse {
  OperationPlan plan = 1;
}

message StartMetadataRestoreRequest {
  string operation_plan_id = 1;
  string plan_hash = 2;
  map<string, string> metadata = 3;
  string operation_id = 4;
}

message StartMetadataRestoreResponse {
  Operation operation = 1;
}

message StartCopyVerifyRequest {
  string operation_plan_id = 1;
  string plan_hash = 2;
  map<string, string> metadata = 3;
  string operation_id = 4;
}

message StartCopyVerifyResponse {
  Operation operation = 1;
}

message StartDRDrillRequest {
  string operation_plan_id = 1;
  string plan_hash = 2;
  map<string, string> metadata = 3;
  string operation_id = 4;
}

message StartDRDrillResponse {
  Operation operation = 1;
}
