syntax = "proto3";

package scrap.metastore.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/petabytecl/scrap/internal/gen/scrap/metastore/v1;metastorev1";

// DocumentRecord is the private authoritative shard metadata record for one
// committed immutable document. It is stored and replayed through shard
// authority; it is not a public gRPC request or response message.
//
// Local Pebble tables, in-memory indexes, read caches, and imported catalogs
// are rebuildable projections derived from authoritative records, published
// metadata artifacts, or both. They must not become independent metadata
// authorities.
message DocumentRecord {
  string tenant_id = 1;
  string transaction_id = 2;
  string document_name = 3;
  uint32 document_class = 4;
  uint32 priority_class = 5;
  optional string content_type = 6;
  uint64 length = 7;
  bytes logical_sha256 = 8;
  bytes stored_sha256 = 9;
  bytes document_identity_fingerprint = 10;
  string created_by_service = 11;
  optional string workflow_stage = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp finalized_at = 14;
  uint32 availability = 15;
  uint32 lifecycle_state = 16;
  map<string, string> tags = 17;
  Location location = 18;
  optional string client_idempotency_key = 19;
  uint32 schema_version = 20;
  string shard_id = 21;
  uint64 committed_index = 22;
  EnvelopeRef envelope_ref = 23;
  RestoreState restore_state = 24;
  UploadState upload_state = 25;
  optional google.protobuf.Timestamp tombstoned_at = 26;
  optional string tombstone_operation_id = 27;
}

// Location identifies the committed byte ranges and object refs needed to
// verify and recover a document without embedding bytes in consensus metadata.
message Location {
  string block_id = 1;
  uint64 stored_offset = 2;
  uint64 stored_length = 3;
  repeated FrameRecord frames = 4;
  repeated ReplicaRef replicas = 5;
  optional string backend_object_key = 6;
  optional string index_object_key = 7;
  optional string envelope_object_key = 8;
  uint32 format_version = 9;
}

// FrameRecord keeps checksum evidence for a document range inside a block.
message FrameRecord {
  uint64 frame_offset = 1;
  uint64 segment_offset = 2;
  uint64 segment_length = 3;
  bytes sha256 = 4;
}

// ReplicaRef records a prepared or committed local member copy that can be
// verified before serving bytes or used as repair evidence.
message ReplicaRef {
  string member_id = 1;
  string block_id = 2;
  uint64 stored_offset = 3;
  uint64 stored_length = 4;
  bytes stored_sha256 = 5;
}

// EnvelopeRef points to OpenBao Transit envelope material needed to decrypt
// encrypted backend data without storing plaintext key material in metadata.
message EnvelopeRef {
  string envelope_id = 1;
  string key_id = 2;
  uint32 key_version = 3;
  bytes envelope_sha256 = 4;
}

enum RestoreState {
  RESTORE_STATE_UNSPECIFIED = 0;
  RESTORE_STATE_HOT = 1;
  RESTORE_STATE_COLD = 2;
  RESTORE_STATE_RESTORE_PENDING = 3;
  RESTORE_STATE_CRYPTO_UNAVAILABLE = 4;
}

enum UploadState {
  UPLOAD_STATE_UNSPECIFIED = 0;
  UPLOAD_STATE_NOT_REQUIRED = 1;
  UPLOAD_STATE_PENDING = 2;
  UPLOAD_STATE_UPLOADED = 3;
  UPLOAD_STATE_FAILED = 4;
}

message TransactionRecord {
  string tenant_id = 1;
  string transaction_id = 2;
  uint32 state = 3;
  uint32 document_count = 4;
  uint32 permanent_document_count = 5;
  uint32 ephemeral_document_count = 6;
  google.protobuf.Timestamp created_at = 7;
  optional google.protobuf.Timestamp completed_at = 8;
  optional google.protobuf.Timestamp timeout_at = 9;
  map<string, string> tags = 10;
  uint32 schema_version = 20;
  string shard_id = 21;
  uint64 committed_index = 22;
}

message UploadIntentRecord {
  string block_id = 1;
  string backend_object_key = 2;
  string index_object_key = 3;
  string envelope_object_key = 4;
  UploadState state = 5;
  optional string last_error = 6;
  google.protobuf.Timestamp updated_at = 7;
  uint32 schema_version = 20;
  string shard_id = 21;
  uint64 committed_index = 22;
}

message RepairStateRecord {
  string tenant_id = 1;
  string transaction_id = 2;
  string document_name = 3;
  string physical_ref = 4;
  string incident_id = 5;
  bool quarantined = 6;
  google.protobuf.Timestamp updated_at = 7;
  uint32 schema_version = 20;
  string shard_id = 21;
  uint64 committed_index = 22;
}

message CommandReceiptRecord {
  string command_id = 1;
  bytes command_sha256 = 2;
  uint32 schema_version = 20;
  string shard_id = 21;
  uint64 committed_index = 22;
}

enum MembershipRole {
  MEMBERSHIP_ROLE_UNSPECIFIED = 0;
  MEMBERSHIP_ROLE_VOTER = 1;
  MEMBERSHIP_ROLE_LEARNER = 2;
}

message MembershipMember {
  uint64 raft_id = 1;
  string member_id = 2;
  MembershipRole role = 3;
}

message MembershipState {
  repeated MembershipMember members = 1;
}

message ShardSnapshot {
  uint32 schema_version = 1;
  string shard_id = 2;
  uint64 last_index = 3;
  repeated DocumentRecord documents = 10;
  repeated TransactionRecord transactions = 11;
  repeated UploadIntentRecord upload_intents = 12;
  repeated RepairStateRecord repair_states = 13;
  MembershipState membership = 14;
  repeated CommandReceiptRecord command_receipts = 15;
}

message ShardCommand {
  uint32 schema_version = 1;
  string shard_id = 2;
  string command_id = 3;
  google.protobuf.Timestamp proposed_at = 4;
  oneof command {
    CommitDocumentCommand commit_document = 10;
    CompleteTransactionCommand complete_transaction = 11;
    RecordUploadIntentCommand record_upload_intent = 12;
    UpdateRestoreStateCommand update_restore_state = 13;
    RecordRepairStateCommand record_repair_state = 14;
    TombstoneDocumentCommand tombstone_document = 15;
    UpdateUploadIntentStateCommand update_upload_intent_state = 16;
  }
}

message CommitDocumentCommand {
  DocumentRecord document = 1;
}

message CompleteTransactionCommand {
  string tenant_id = 1;
  string transaction_id = 2;
  google.protobuf.Timestamp completed_at = 3;
  map<string, string> tags = 4;
}

message RecordUploadIntentCommand {
  string block_id = 1;
  string backend_object_key = 2;
  string index_object_key = 3;
  string envelope_object_key = 4;
}

message UpdateUploadIntentStateCommand {
  string block_id = 1;
  UploadState state = 2;
  optional string last_error = 3;
}

message UpdateRestoreStateCommand {
  string tenant_id = 1;
  string transaction_id = 2;
  optional string document_name = 3;
  RestoreState restore_state = 4;
  string reason = 5;
}

message RecordRepairStateCommand {
  string tenant_id = 1;
  string transaction_id = 2;
  string document_name = 3;
  string physical_ref = 4;
  string incident_id = 5;
  bool quarantined = 6;
}

message TombstoneDocumentCommand {
  string tenant_id = 1;
  string transaction_id = 2;
  string document_name = 3;
  google.protobuf.Timestamp tombstoned_at = 4;
  string operation_id = 5;
}
