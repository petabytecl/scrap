version: "2"

run:
  go: "1.26"
  timeout: 5m
  tests: true

issues:
  max-same-issues: 20

formatters:
  enable:
    - goimports
    - gci
    - gofumpt
    - gofmt
  settings:
    goimports:
      local-prefixes:
        - github.com/petabytecl/scrap
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/petabytecl/scrap)
    gofumpt:
      module-path: github.com/petabytecl/scrap
      extra-rules: true
    gofmt:
      simplify: true
      rewrite-rules:
        - pattern: "interface{}"
          replacement: any
        - pattern: "a[b:len(a)]"
          replacement: "a[b:]"

linters:
  default: none
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - errcheck
    - errorlint
    - gosec
    - govet
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - staticcheck

  exclusions:
    paths:
      # Generated protobuf/gRPC code is verified by buf and generated-code
      # cleanliness checks. Handwritten code must satisfy the lint baseline.
      - ^internal/gen/
      # Spike code is disposable evidence, not production storage-gateway code.
      # Production code paths remain covered by the lint baseline.
      - ^internal/spike/
    rules:
      # Test cleanup and temporary-file probes are not release-safety signals.
      - path: _test\.go
        linters:
          - errcheck
          - gosec
