name: ci

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install buf
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.66.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - run: make check

      - name: Generate coverage profile
        run: make cover

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.out
          flags: go
          name: scrap-go
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true

  vulnerability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - run: make vuln
