name: ci

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install buf
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.66.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run validation gate
        id: check
        run: make check
        continue-on-error: true

      - name: Generate coverage profile
        id: coverage
        if: ${{ always() && steps.check.outcome == 'success' }}
        run: make cover
        continue-on-error: true

      - name: Upload coverage to Codecov
        if: ${{ always() && steps.coverage.outcome == 'success' }}
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.out
          flags: go
          name: scrap-go
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true

      - name: Generate JUnit test report
        id: test-results
        if: ${{ always() }}
        run: make test-junit
        continue-on-error: true

      - name: Upload test results to Codecov
        if: ${{ always() && hashFiles('test-results/junit.xml') != '' }}
        uses: codecov/codecov-action@v6
        with:
          report_type: test_results
          files: ./test-results/junit.xml
          flags: go
          name: scrap-go-tests
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true

      - name: Fail if validation failed
        if: ${{ steps.check.outcome == 'failure' || steps.coverage.outcome == 'failure' || steps.test-results.outcome == 'failure' }}
        run: exit 1

  vulnerability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - run: make vuln
