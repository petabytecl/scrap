name: ci

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
  push:
    branches:
      - main
      - v2

jobs:
  static:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools.go.sum

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.66.0"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: Check manifests
        run: make manifests-check

      - name: Check gate wiring
        run: make gates-check

      - name: Check formatting
        run: make GOLANGCI_LINT=golangci-lint fmt-check

      - name: Check package boundaries
        run: make package-boundaries

      - name: Install protoc Go plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2

      - name: Check protobuf schemas
        run: make BUF=buf proto-check

  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools.go.sum

      - name: Test, cover, and generate JUnit report
        id: test-report
        run: make test-cover
        continue-on-error: true

      - name: Upload coverage to Codecov
        if: ${{ always() && steps.test-report.outcome == 'success' }}
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.out
          flags: go
          name: scrap-v2-go
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true

      - name: Upload test results to Codecov
        if: ${{ always() && hashFiles('test-results/junit.xml') != '' }}
        uses: codecov/codecov-action@v6
        with:
          report_type: test_results
          files: ./test-results/junit.xml
          flags: go
          name: scrap-v2-go-tests
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true

      - name: Fail if tests failed
        if: ${{ steps.test-report.outcome == 'failure' }}
        run: exit 1

  race:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools.go.sum

      - name: Run race tests
        run: make test-race

  integration:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools.go.sum

      - name: Run integration tests
        run: make integration

  build:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools.go.sum

      - name: Build binaries
        run: make build

  vulnerability:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools.go.sum

      - run: make vuln

  e2e:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    if: contains(github.event.pull_request.labels.*.name, 'e2e') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools.go.sum

      - name: Run E2E tests
        run: make tier2-e2e-up

      - name: Collect E2E diagnostics
        if: ${{ always() }}
        run: |
          ARTIFACT_DIR=artifacts/e2e \
          KUBE_CONTEXT=kind-scrap-prodlike \
          scripts/collect-kind-artifacts.sh

      - name: Upload E2E artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-tier2-e2e-${{ github.run_id }}
          path: artifacts
          if-no-files-found: warn

  e2e-status:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs:
      - e2e
    if: ${{ always() }}
    steps:
      - name: Verify Tier 2 E2E status
        env:
          E2E_RESULT: ${{ needs.e2e.result }}
          E2E_REQUESTED: ${{ contains(github.event.pull_request.labels.*.name, 'e2e') || github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$E2E_REQUESTED" = "true" ]; then
            test "$E2E_RESULT" = success
            echo "Tier 2 E2E requested; the e2e job passed the prod-like Cilium gate."
          else
            test "$E2E_RESULT" = skipped
            echo "Tier 2 E2E skipped; add the e2e label or run workflow_dispatch to execute it."
          fi

  check:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs:
      - static
      - test
      - race
      - integration
      - build
      - vulnerability
      - e2e
      - e2e-status
    if: ${{ always() }}
    steps:
      - name: Verify Tier 1 split CI jobs and optional Tier 2
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          TEST_RESULT: ${{ needs.test.result }}
          RACE_RESULT: ${{ needs.race.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          VULNERABILITY_RESULT: ${{ needs.vulnerability.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          E2E_STATUS_RESULT: ${{ needs.e2e-status.result }}
          E2E_REQUESTED: ${{ contains(github.event.pull_request.labels.*.name, 'e2e') || github.event_name == 'workflow_dispatch' }}
        run: |
          test "$STATIC_RESULT" = success
          test "$TEST_RESULT" = success
          test "$RACE_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$VULNERABILITY_RESULT" = success
          echo "Tier 1 commit gate passed across split CI jobs."
          test "$E2E_STATUS_RESULT" = success
          if [ "$E2E_REQUESTED" = "true" ]; then
            test "$E2E_RESULT" = success
          else
            test "$E2E_RESULT" = skipped
          fi
