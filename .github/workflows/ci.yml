name: ci

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  static:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools.go.sum

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.66.0"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.10.1
          args: --timeout=5m

      - name: Check manifests
        run: make manifests-check

      - name: Check formatting
        run: make GOLANGCI_LINT=golangci-lint fmt-check

      - name: Check protobuf schemas
        run: make BUF=buf proto-check

  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools.go.sum

      - name: Run compatibility tests
        run: make test-compat

      - name: Verify crash-fault catalog
        run: make test-crashfault-catalog

      - name: Test, cover, and generate JUnit report
        id: test-report
        run: make test-cover
        continue-on-error: true

      - name: Upload coverage to Codecov
        if: ${{ always() && steps.test-report.outcome == 'success' }}
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.out
          flags: go
          name: scrap-go
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true

      - name: Upload test results to Codecov
        if: ${{ always() && hashFiles('test-results/junit.xml') != '' }}
        uses: codecov/codecov-action@v6
        with:
          report_type: test_results
          files: ./test-results/junit.xml
          flags: go
          name: scrap-go-tests
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true

      - name: Fail if tests failed
        if: ${{ steps.test-report.outcome == 'failure' }}
        run: exit 1

  race:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools.go.sum

      - name: Run race tests
        run: make test-race

  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools.go.sum

      - name: Build binaries
        run: make build

  vulnerability:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools.go.sum

      - run: make vuln

  check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs:
      - static
      - test
      - race
      - build
      - vulnerability
    if: ${{ always() }}
    steps:
      - name: Verify split CI jobs
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          TEST_RESULT: ${{ needs.test.result }}
          RACE_RESULT: ${{ needs.race.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          VULNERABILITY_RESULT: ${{ needs.vulnerability.result }}
        run: |
          test "$STATIC_RESULT" = success
          test "$TEST_RESULT" = success
          test "$RACE_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$VULNERABILITY_RESULT" = success
