coverage:
  status:
    project:
      default:
        target: 80%
        threshold: 0%
        if_ci_failed: error
    patch:
      default:
        target: 80%
        threshold: 0%
        if_ci_failed: error

flags:
  product:
    paths:
      - cmd/**
      - internal/**
    carryforward: false

comment:
  layout: "reach,diff,flags,components,tree,footer"
  behavior: default
  require_changes: false

component_management:
  individual_components:
    - component_id: storage-core
      name: Storage Core
      paths:
        - internal/block/**
        - internal/index/**
        - internal/store/**
      statuses:
        - type: project
          target: 82%
          threshold: 0%
    - component_id: consensus
      name: Shard Authority
      paths:
        - internal/raft/**
        - internal/peer/**
        - internal/shard/**
      statuses:
        - type: project
          target: 80%
          threshold: 0%
    - component_id: backend-lifecycle
      name: Backend Lifecycle
      paths:
        - internal/backend/**
        - internal/localblock/**
        - internal/eviction/**
      statuses:
        - type: project
          target: 82%
          threshold: 0%
    - component_id: security-control
      name: Security and Control
      paths:
        - internal/security/**
        - internal/encryption/**
        - internal/audit/**
        - internal/admin/**
      statuses:
        - type: project
          target: 80%
          threshold: 0%
    - component_id: integrity-background
      name: Integrity Background Work
      paths:
        - internal/scrub/**
        - internal/avscan/**
        - internal/quarantine/**
      statuses:
        - type: project
          target: 84%
          threshold: 0%
    - component_id: transport
      name: Transport and Composition
      paths:
        - cmd/scrapd/**
        - internal/server/**
        - internal/cmd/**
        - internal/routing/**
        - internal/telemetry/**
      statuses:
        - type: project
          target: 75%
          threshold: 0%

ignore:
  - "gen/**"
  - "scripts/**"
  - "test/**"
  - "internal/spike/**"
  - "internal/encryption/enctest/**"
