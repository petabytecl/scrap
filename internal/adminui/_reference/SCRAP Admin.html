<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>S.C.R.A.P. Admin — Petabyte</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/favicon.ico"/>
<link rel="stylesheet" href="colors_and_type.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--pb-background); color: var(--pb-foreground); font-family: var(--pb-font-sans); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; line-height: 1.5; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--pb-ring); outline-offset: 2px; }
  button { font-family: inherit; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--pb-muted); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--pb-fg4); }

  .admin-layout { display: flex; min-height: 100vh; }
  .admin-main {
    margin-left: 220px; flex: 1;
    padding: 40px 56px;
    max-width: calc(100vw - 220px);
  }

  .admin-topbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 36px; padding-bottom: 24px;
    border-bottom: 1px solid var(--pb-border-subtle);
  }

  .admin-clock {
    font-family: var(--pb-font-mono); font-size: 12px;
    color: var(--pb-fg4); letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
  }

  /* Breadcrumbs */
  .breadcrumbs {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--pb-font-mono); font-size: 11px;
    color: var(--pb-fg4); margin-bottom: 10px;
    letter-spacing: 0.04em;
  }
  .breadcrumbs button {
    background: none; border: none; color: var(--pb-fg4);
    cursor: pointer; padding: 0; font-family: inherit;
    font-size: inherit; letter-spacing: inherit;
    transition: color 150ms;
  }
  .breadcrumbs button:hover { color: var(--pb-primary); }
  .breadcrumbs .sep { opacity: 0.5; user-select: none; }
  .breadcrumbs .current { color: var(--pb-fg2); }

  /* Live pulse */
  @keyframes pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .live-dot { animation: pulse-dot 2s ease-in-out infinite; }

  /* Environment pill */
  .env-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 9px; border-radius: var(--pb-radius-full);
    font-family: var(--pb-font-mono); font-size: 10px; font-weight: 500;
    letter-spacing: 0.12em; text-transform: uppercase;
    background: rgba(0,147,208,0.10); color: var(--pb-primary);
    border: 1px solid rgba(0,147,208,0.22);
  }

  @media (max-width: 900px) {
    .admin-main { margin-left: 0; padding: 24px 20px; max-width: 100vw; }
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="mock-data.jsx"></script>
<script type="text/babel" src="shared-ui.jsx"></script>
<script type="text/babel" src="sidebar.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel" src="view-overview.jsx"></script>
<script type="text/babel" src="view-capacity.jsx"></script>
<script type="text/babel" src="view-members.jsx"></script>
<script type="text/babel" src="view-clients.jsx"></script>
<script type="text/babel" src="view-backend.jsx"></script>
<script type="text/babel" src="view-raft.jsx"></script>
<script type="text/babel" src="view-openbao.jsx"></script>
<script type="text/babel" src="view-operations.jsx"></script>
<script type="text/babel" src="view-repair.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "refreshInterval": 20,
  "compactNumbers": true,
  "showSparklines": true,
  "accentColor": "#0093D0",
  "densePadding": false
}/*EDITMODE-END*/;

const { useState, useEffect, createContext, useContext, useCallback } = React;

const TweaksCtx = createContext(TWEAK_DEFAULTS);
window.TweaksCtx = TweaksCtx;

// Navigation context — supports sub-pages like members/member-5
const NavCtx = createContext({});
window.NavCtx = NavCtx;
window.useNav = () => useContext(NavCtx);

const AdminApp = () => {
  // Route: { view, sub, params }
  const [route, setRoute] = useState({ view: 'overview', sub: null, params: {} });
  const [clock, setClock] = useState(new Date());
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  const navigate = useCallback((view, sub, params) => {
    setRoute({ view, sub: sub || null, params: params || {} });
    window.scrollTo(0, 0);
  }, []);

  const navCtx = { route, navigate };

  useEffect(() => {
    document.documentElement.style.setProperty('--pb-primary', tweaks.accentColor);
    document.documentElement.style.setProperty('--pb-primary-hover', tweaks.accentColor + 'CC');
    document.documentElement.style.setProperty('--pb-ring', tweaks.accentColor);
  }, [tweaks.accentColor]);

  useEffect(() => {
    const id = setInterval(() => setClock(new Date()), 1000);
    return () => clearInterval(id);
  }, []);

  // Resolve view component
  const viewMap = {
    overview: OverviewView, capacity: CapacityView, members: MembersView,
    clients: ServiceMeshView,
    backend: BackendView, raft: RaftView, openbao: OpenBaoView,
    operations: OperationsView, repair: RepairView,
  };
  const CurrentView = viewMap[route.view] || OverviewView;
  const viewLabel = NAV_ITEMS.find(n => n.id === route.view)?.label || 'Overview';

  // Breadcrumb trail
  const crumbs = [{ label: viewLabel, onClick: () => navigate(route.view) }];
  if (route.sub) crumbs.push({ label: route.sub, current: true });

  return (
    <TweaksCtx.Provider value={tweaks}>
    <NavCtx.Provider value={navCtx}>
    <div className="admin-layout">
      <Sidebar activeView={route.view} onNavigate={(v) => navigate(v)}/>
      <main className="admin-main">
        {/* Top bar */}
        <div className="admin-topbar">
          <div>
            {crumbs.length > 1 && (
              <div className="breadcrumbs">
                {crumbs.map((c, i) => (
                  <React.Fragment key={i}>
                    {i > 0 && <span className="sep">/</span>}
                    {c.current
                      ? <span className="current">{c.label}</span>
                      : <button onClick={c.onClick}>{c.label}</button>
                    }
                  </React.Fragment>
                ))}
              </div>
            )}
            <h1 style={{
              fontFamily: 'var(--pb-font-heading)', fontSize: 26, fontWeight: 700,
              color: 'var(--pb-fg1)', margin: 0, letterSpacing: '-0.01em',
            }}>
              {route.sub || viewLabel}
            </h1>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
            <span className="env-pill">
              <span style={{ display: 'inline-block', width: 5, height: 5, borderRadius: '50%', background: 'var(--pb-primary)' }}></span>
              Production
            </span>
            <div className="admin-clock">
              {clock.getFullYear()}-{String(clock.getMonth() + 1).padStart(2, '0')}-{String(clock.getDate()).padStart(2, '0')}
              {' '}
              {String(clock.getHours()).padStart(2, '0')}:{String(clock.getMinutes()).padStart(2, '0')}:{String(clock.getSeconds()).padStart(2, '0')}
            </div>
            <div style={{
              display: 'flex', alignItems: 'center', gap: 6,
              padding: '4px 10px', borderRadius: 'var(--pb-radius-full)',
              background: 'rgba(52,211,153,0.08)', border: '1px solid rgba(52,211,153,0.18)',
            }}>
              <span className="live-dot" style={{ display: 'inline-block', width: 6, height: 6, borderRadius: '50%', background: '#34D399' }}></span>
              <span style={{ fontSize: 10, fontFamily: 'var(--pb-font-mono)', color: '#34D399', fontWeight: 500, letterSpacing: '0.12em', textTransform: 'uppercase' }}>Live</span>
            </div>
          </div>
        </div>

        <CurrentView/>
      </main>

      <TweaksPanel>
        <TweakSection title="Dashboard">
          <TweakSlider label="Auto-refresh (s)" value={tweaks.refreshInterval} min={5} max={120} step={5} onChange={v => setTweak('refreshInterval', v)}/>
          <TweakToggle label="Compact numbers" value={tweaks.compactNumbers} onChange={v => setTweak('compactNumbers', v)}/>
          <TweakToggle label="Sparklines" value={tweaks.showSparklines} onChange={v => setTweak('showSparklines', v)}/>
        </TweakSection>
        <TweakSection title="Theme">
          <TweakColor label="Accent" value={tweaks.accentColor} options={['#0093D0', '#0EA5E9', '#6366F1', '#34D399']} onChange={v => setTweak('accentColor', v)}/>
        </TweakSection>
      </TweaksPanel>
    </div>
    </NavCtx.Provider>
    </TweaksCtx.Provider>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<AdminApp/>);
</script>
</body>
</html>
