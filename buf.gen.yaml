version: v2
clean: true
plugins:
  - local:
      - go
      - run
      - google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
    out: internal/gen
    opt: paths=source_relative
  - local:
      - go
      - run
      - google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
    out: internal/gen
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false
