version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/petabytecl/scrap/gen
plugins:
  - local:
      - go
      - tool
      - -modfile=tools.go.mod
      - protoc-gen-go
    out: gen/go
    opt: paths=source_relative
  - local:
      - go
      - tool
      - -modfile=tools.go.mod
      - protoc-gen-go-grpc
    out: gen/go
    opt: paths=source_relative
